[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toroidal-compression-demo"
version = "0.1.0"
description = "Demo/evaluation edition of Toroidal Compression."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "gradio>=4.36.0",
]

[tool.setuptools]
packages = ["toroidal_compression_demo"]
py-modules = ["benchmark_demo"]

[project.scripts]
toroidal-demo-benchmark = "benchmark_demo:main"
